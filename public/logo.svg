<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="100%" height="100%">
  <defs>
    <linearGradient id="vetgoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#059669" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Icon Emblem -->
  <rect x="6" y="6" width="48" height="48" rx="12" fill="url(#vetgoGrad)" filter="url(#glow)"/>
  
  <!-- Stylized V with Paw & Stethoscope Motif -->
  <path d="M 20 20 L 30 38 L 40 20" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="30" cy="23" r="2.5" fill="#ffffff" />
  
  <!-- Paw Dots -->
  <circle cx="23" cy="15" r="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="37" cy="15" r="1.8" fill="#ffffff" opacity="0.9"/>
  <circle cx="30" cy="12" r="1.8" fill="#ffffff" opacity="0.9"/>

  <!-- Brand Typography -->
  <text x="64" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" letter-spacing="-0.5" fill="#0f172a">
    Vet<tspan fill="#10b981">go</tspan>
  </text>
  <text x="65" y="49" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9" font-weight="700" letter-spacing="1.2" fill="#64748b" text-transform="uppercase">
    Gestão Veterinária
  </text>
</svg>
